# =============================================================================
# Stage 1 for 200B MoE — Seedance 2.0 scale pretraining
#
# LAUNCH:
#   torchrun --nproc_per_node=8 scripts/train.py --config configs/train/stage1_200b_moe.yaml
#
# Requires 8× A100 80GB or better (FSDP FULL_SHARD + CPU offload)
# =============================================================================

training:
  stage: 1
  description: "200B MoE video-only pretraining (Seedance 2.0 scale)"

  model_config: "configs/model/db_dit_200b_moe.yaml"

  data:
    _target_: flux.data.VideoDataset
    manifest_path: "data/manifests/train_stage1.csv"
    resolution: 256
    num_frames: 32
    frame_stride: 1
    fps_condition: true
    caption_dropout_prob: 0.1

  model_init:
    config: "configs/model/db_dit_200b_moe.yaml"
    vision_branch: "pixart"
    temporal_layers: "zero"
    audio_branch: "frozen"

  optimizer:
    type: "adamw"
    lr: 5.0e-5                     # Very low LR for stability at this scale
    betas: [0.9, 0.95]
    weight_decay: 0.1
    eps: 1.0e-8

  scheduler:
    type: "cosine"
    warmup_steps: 5000
    min_lr: 1.0e-7

  max_steps: 500000
  batch_size: 1                    # Per GPU
  gradient_accumulation_steps: 64  # Effective batch = 1 × 8 × 64 = 512
  mixed_precision: "bf16"
  gradient_checkpointing: true
  cpu_offload: true                # FSDP CPU offload for optimizer states

  ema:
    decay: 0.9999
    update_every: 50

  loss:
    type: "flow_matching"
    logit_normal_mean: 0.0
    logit_normal_std: 1.0

  logging:
    log_every: 10
    sample_every: 2000
    checkpoint_every: 5000
    keep_last_n_checkpoints: 2
    wandb: false

  distributed:
    backend: "nccl"
    fsdp_sharding_strategy: "FULL_SHARD"
