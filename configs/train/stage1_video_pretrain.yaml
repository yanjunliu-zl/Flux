# Stage 1: Video Pretraining
# Train vision branch on large-scale video dataset

training:
  stage: 1
  description: "Video-only pretraining on large-scale dataset"

  # Model architecture (1.44B params, Base variant)
  model:
    dim: 1024
    num_layers: 24
    num_heads: 16
    ffn_ratio: 4.0
    qk_norm: true
    dropout: 0.0
    video_patch_size: [1, 2, 2]
    video_latent_channels: 16
    audio_patch_size: [1, 4]
    audio_latent_channels: 8

  # Data
  data:
    _target_: seedance.data.VideoDataset
    manifest_path: "data/manifests/train_all.csv"
    resolution: 256
    num_frames: 32
    frame_stride: 1
    fps_condition: true
    caption_dropout_prob: 0.1  # For CFG

  # Bucketing
  bucket:
    enabled: true
    buckets:
      - [256, 16, "1:1"]
      - [256, 32, "1:1"]
      - [256, 16, "16:9"]
      - [256, 32, "16:9"]

  # Model initialization
  model_init:
    vision_branch: "pixart"  # Initialize from PixArt-alpha weights
    temporal_layers: "zero"  # Zero-init temporal attention projections
    audio_branch: "frozen"   # Audio branch frozen in stage 1
    video_vae: "pretrained"  # Use pretrained VideoVAE

  # Optimization
  optimizer:
    type: "adamw"
    lr: 2.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.01
    eps: 1.0e-8

  scheduler:
    type: "cosine"
    warmup_steps: 5000
    min_lr: 1.0e-5

  # Training loop
  max_steps: 500000
  batch_size: 8  # Per GPU (increased from 4 for better GPU utilization)
  gradient_accumulation_steps: 2  # Effective batch = 8 * 2 = 16
  num_workers: 8  # More CPU workers for video I/O
  mixed_precision: "bf16"
  gradient_checkpointing: true

  # EMA
  ema:
    decay: 0.9999
    update_every: 1

  # Loss
  loss:
    type: "flow_matching"
    logit_normal_mean: 0.0
    logit_normal_std: 1.0

  # World model (VideoWorld 2): pure visual self-supervision
  world_model:
    enabled: false            # Future prediction + temporal consistency loss
    cross_scale_attn: false   # Cross-scale causal attention in temporal layers
    pred_weight: 1.0
    temporal_weight: 0.5
    physics_weight: 0.1

  # Logging
  logging:
    log_every: 100
    sample_every: 5000
    checkpoint_every: 10000
    keep_last_n_checkpoints: 5
    wandb: false
    tensorboard: true
    tensorboard_log_dir: "runs/stage1_video_pretrain"

  # Distributed
  distributed:
    backend: "nccl"
    fsdp_sharding_strategy: "FULL_SHARD"
