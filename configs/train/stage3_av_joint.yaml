# Stage 3: Audio-Video Joint Training
# Full model training with CBGA for AV synchronization

training:
  stage: 3
  description: "Audio-Video joint training with cross-modal bridge"

  data:
    _target_: seedance.data.AVDataset
    manifest_path: "data/manifests/av_train.csv"
    video:
      resolution: 256
      num_frames: 32
      frame_stride: 1
    audio:
      sample_rate: 16000
      n_mels: 80
      hop_length: 256
    caption_dropout_prob: 0.1
    first_frame_condition_prob: 0.3  # For I2VA training

  model_init:
    vision_branch: "from_stage1_checkpoint"
    audio_branch: "from_stage2_checkpoint"
    cbga_gates: "zero"  # Zero-init CBGA gates
    video_vae: "frozen"
    audio_vae: "frozen"

  optimizer:
    type: "adamw"
    lr: 5.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.01
    eps: 1.0e-8

  scheduler:
    type: "cosine"
    warmup_steps: 3000
    min_lr: 1.0e-6

  max_steps: 300000
  batch_size: 2
  gradient_accumulation_steps: 4
  mixed_precision: "bf16"
  gradient_checkpointing: true

  ema:
    decay: 0.9999
    update_every: 1

  loss:
    type: "flow_matching_joint"
    video_weight: 1.0
    audio_weight: 1.0
    sync_weight: 0.1
    logit_normal_mean: 0.0
    logit_normal_std: 1.0

  logging:
    log_every: 100
    sample_every: 5000
    checkpoint_every: 10000
    keep_last_n_checkpoints: 5
    wandb: true

  distributed:
    backend: "nccl"
    fsdp_sharding_strategy: "FULL_SHARD"
