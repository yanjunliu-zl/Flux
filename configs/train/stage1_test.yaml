# Stage 1 Test: Quick verification run
# Small config for fast iteration and debugging

training:
  stage: 1
  description: "Video-only pretraining TEST RUN"

  data:
    _target_: flux.data.VideoDataset
    manifest_path: "data/manifests/train.csv"
    resolution: 128          # Small frames
    num_frames: 8            # Few frames
    frame_stride: 2
    fps_condition: false
    caption_dropout_prob: 0.1
    use_short_caption: true

  optimizer:
    type: "adamw"
    lr: 2.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.01
    eps: 1.0e-8

  scheduler:
    type: "cosine"
    warmup_steps: 20
    min_lr: 1.0e-5

  max_steps: 200
  batch_size: 1
  gradient_accumulation_steps: 1
  mixed_precision: "fp32"
  gradient_checkpointing: false

  ema:
    decay: 0.9999
    update_every: 10

  loss:
    type: "flow_matching"
    logit_normal_mean: 0.0
    logit_normal_std: 1.0

  logging:
    log_every: 10
    sample_every: 100
    checkpoint_every: 100
    keep_last_n_checkpoints: 2
    wandb: false

  distributed:
    backend: "nccl"
    fsdp_sharding_strategy: "FULL_SHARD"
